apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Cabinet API
    type: marcusolsson-json-datasource
    access: proxy
    url: http://cabinet-api:8080
    editable: false
    jsonData:
      httpHeaderName1: 'X-API-Key'
    secureJsonData:
      httpHeaderValue1: '${CABINET_API_KEY}'
