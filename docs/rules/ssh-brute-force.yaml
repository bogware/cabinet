# An example detection rule kept as code. Test it with:  cabinet rules test docs/rules
# Push it with:  CABINET_API_KEY=... cabinet rules push docs/rules --server https://cabinet.example.com
id: example-ssh-brute-force
name: SSH password guessing from one address
description: Many failed SSH passwords from one address in a few minutes.
severity: Error
enabled: true
pattern: Failed password for
extract: from (?<src>\d{1,3}(?:\.\d{1,3}){3})
group_by: src
threshold: 10
window_seconds: 300
cooldown_seconds: 900
technique: T1110.001
tests:
  - line: "Mar  4 05:06:07 web1 sshd[812]: Failed password for root from 203.0.113.9 port 51234 ssh2"
    match: true
    fields:
      src: 203.0.113.9
  - line: "Mar  4 05:06:08 web1 sshd[812]: Accepted publickey for deploy from 10.0.0.4 port 50111 ssh2"
    match: false
