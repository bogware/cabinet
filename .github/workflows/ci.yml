name: CI

# Manual only: run it from the Actions tab or `gh workflow run ci.yml --ref <branch>`. Nothing
# runs on push, pull request, tag or schedule (docs/CI.md). The Release workflow calls it too,
# with the commit it is about to release, so a release is always the commit that was tested.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (a full SHA, from the Release workflow)
        type: string
        required: true

env:
  DOTNET_VERSION: '10.0.x'

# Runner policy, see docs/CI.md. Read-only token; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ vars.CABINET_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64"]') }}
    permissions:
      contents: read
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cabinet
          POSTGRES_PASSWORD: cabinet-ci
          POSTGRES_DB: cabinet
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U cabinet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: cabinet
          CLICKHOUSE_PASSWORD: cabinet-ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user cabinet --password cabinet-ci --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
    - name: Check the commit to test
      if: inputs.ref != ''
      env:
        REF: ${{ inputs.ref }}
      run: |
        if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::ref must be a full commit SHA"
          exit 1
        fi

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - uses: ./.github/actions/isolate-job

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Check packaging tools
      if: runner.environment == 'self-hosted'
      run: |
        for tool in docker python3 dpkg-deb sha256sum openssl; do
          command -v "$tool" >/dev/null || echo "::warning::$tool is missing; release jobs need it"
        done

    - name: Validate compose file
      run: docker compose config --quiet
      env:
        CABINET_API_KEY: ci-validation-only
        CABINET_AGENT_API_KEY: ci-validation-only-agent
        CABINET_DB_PASSWORD: ci-validation-only
        CABINET_GRAFANA_PASSWORD: ci-validation-only

    - name: Validate Kubernetes manifests
      run: |
        docker run --rm -v "$PWD/k8s:/k8s:ro" registry.k8s.io/kubectl:v1.31.0 kustomize /k8s > k8s-rendered.yaml
        docker run --rm -v "$PWD/k8s-rendered.yaml:/rendered.yaml:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /rendered.yaml

    - name: Validate Prometheus rules
      run: docker run --rm --entrypoint promtool -v "$PWD/prometheus-rules.yml:/rules.yml:ro" prom/prometheus:v2.54.1 check rules /rules.yml

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      env:
        TZ: America/Chicago
        # Tests run in parallel and each makes its own pools; smaller pools that drop idle
        # connections quickly keep them under the service's default of 100 connections
        CABINET_TEST_POSTGRES_CONNSTR: Host=localhost;Port=${{ job.services.postgres.ports['5432'] }};Database=cabinet;Username=cabinet;Password=cabinet-ci;Maximum Pool Size=20;Connection Idle Lifetime=10;Connection Pruning Interval=5
        CABINET_TEST_OPENSEARCH_URL: http://localhost:${{ job.services.opensearch.ports['9200'] }}
        CABINET_TEST_CLICKHOUSE_URL: http://localhost:${{ job.services.clickhouse.ports['8123'] }}
        CABINET_TEST_CLICKHOUSE_USER: cabinet
        CABINET_TEST_CLICKHOUSE_PASS: cabinet-ci
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    - name: PostgreSQL backup and restore drill
      run: ./tests/EndToEnd/backup-drill.sh

    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/**'
        retention-days: 30

    - name: Remove job state
      if: always()
      run: rm -rf "$CABINET_JOB_DIR"
