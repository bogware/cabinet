# The docs as a site, ready for when the repository goes public:
#   pip install mkdocs-material && mkdocs serve
# The Markdown in docs/ is written to read the same on GitHub and here.
site_name: Cabinet
site_description: Self-hosted log search and security analytics. Ask your logs anything.
docs_dir: docs
repo_url: https://github.com/bogware/cabinet
edit_uri: edit/main/docs/
copyright: Cabinet is AGPL-3.0; its forwarding agent is Apache-2.0.

theme:
  name: material
  logo: images/icon.svg
  favicon: images/icon.svg
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
      toggle: { icon: material/weather-sunny, name: Light mode }
    - scheme: default
      primary: blue
      accent: light blue
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Searching: BQL-GUIDE.md
  - Features: FEATURES.md
  - Deployment: DEPLOYMENT.md
  - API: API-GUIDE.md
  - Benchmarks: BENCHMARKS.md
  - Architecture: ARCHITECTURE.md
  - CI: CI.md
