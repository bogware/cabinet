services:
  # Cabinet API Service
  cabinet-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cabinet-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Storage__Type=PostgreSQL
      - Storage__ConnectionString=Host=postgres;Port=5432;Database=cabinet;Username=cabinet;Password=${CABINET_DB_PASSWORD:?Set CABINET_DB_PASSWORD, see .env.example}
      - Storage__MetadataConnectionString=Data Source=/app/data/cabinet-metadata.db
      - ApiKeys__Keys__0__Key=${CABINET_API_KEY:?Set CABINET_API_KEY environment variable}
      - ApiKeys__Keys__0__Tier=Admin
      - ApiKeys__Keys__0__Name=Docker Admin Client
    volumes:
      - cabinet-data:/app/data
      - cabinet-logs:/app/logs
      - ./logs:/app/input:ro  # Mount host logs for analysis
    depends_on:
      - postgres
    networks:
      - cabinet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cabinet CLI (configured for remote mode)
  cabinet-cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    container_name: cabinet-cli
    environment:
      - CABINET_MODE=remote
      - CABINET_API_URL=http://cabinet-api:8080
      - CABINET_API_KEY=${CABINET_API_KEY:?Set CABINET_API_KEY environment variable}
    volumes:
      - ./logs:/app/logs:ro  # Mount host logs directory for analysis
    depends_on:
      - cabinet-api
    networks:
      - cabinet-network
    restart: "no"
    stdin_open: true
    tty: true
    command: ["version"]

  # Cabinet Agent (log forwarding)
  cabinet-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: cabinet-agent
    environment:
      - Agent__Inputs__0__Paths__0=/var/log/host/*.log
      - Agent__Inputs__0__Paths__1=/var/log/host/*.txt
      - Agent__Output__ServerUrl=http://cabinet-api:8080
      - Agent__Output__ApiKey=${CABINET_API_KEY:?Set CABINET_API_KEY environment variable}
      - Agent__Output__VerifySsl=false
      - Agent__Registry__Path=/app/data/registry.json
      - Agent__Output__SpillDirectory=/app/data/spool
    volumes:
      - cabinet-agent-data:/app/data
      - ./logs:/var/log/host:ro  # Mount host logs for forwarding
    depends_on:
      - cabinet-api
    networks:
      - cabinet-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cabinet-postgres
    environment:
      - POSTGRES_DB=cabinet
      - POSTGRES_USER=cabinet
      - POSTGRES_PASSWORD=${CABINET_DB_PASSWORD:?Set CABINET_DB_PASSWORD, see .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cabinet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: cabinet-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${CABINET_GRAFANA_PASSWORD:?Set CABINET_GRAFANA_PASSWORD, see .env.example}
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - cabinet-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: cabinet-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - cabinet-network
    restart: unless-stopped
    profiles:
      - monitoring

  # LocalStack for AWS Services (Development)
  localstack:
    image: localstack/localstack:latest
    container_name: cabinet-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=s3,sqs,sns
      - DEBUG=0
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cabinet-network
    restart: unless-stopped
    profiles:
      - development

volumes:
  cabinet-data:
    driver: local
  cabinet-logs:
    driver: local
  cabinet-agent-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  localstack-data:
    driver: local

networks:
  cabinet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16