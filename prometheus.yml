# Prometheus scrape configuration for Cabinet
# Used by docker-compose monitoring profile

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cabinet-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['cabinet-api:8080']
        labels:
          service: 'cabinet-api'
          environment: 'docker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
