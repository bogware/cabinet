openapi: 3.0.3
info:
  title: Cabinet API
  description: |
    Enterprise Log Intelligence System API

    Cabinet provides a comprehensive API for log ingestion, analysis, querying, and detection.
    This API enables AI agents and applications to interact with the Cabinet system programmatically.

    ## Key Features
    - **Log Ingestion**: Batch log ingestion with automatic parsing
    - **Query Engine**: Powerful query language for log analysis
    - **Detection Suites**: Multiple detection algorithms for security analysis
    - **Real-time Streaming**: Server-sent events for real-time log monitoring
    - **API Key Authentication**: Tier-based access control

    ## Authentication
    All API requests require an API key provided via the `X-API-Key` header or `api_key` query parameter.

    ## Rate Limiting
    - Basic tier: 100 requests/minute
    - Professional tier: 1000 requests/minute
    - Enterprise tier: Unlimited

  version: 1.0.0
  contact:
    name: Cabinet Support
    email: support@cabinet.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.cabinet.io
    description: Production server

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

  schemas:
    LogEvent:
      type: object
      required:
        - id
        - timestamp
        - message
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the log event
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        message:
          type: string
          description: Log message content
        severity:
          type: string
          enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
          description: Log severity level
        source_type:
          type: string
          enum: [GAME_SERVER, WEB_SERVER, APPLICATION, SYSTEM, CUSTOM]
          description: Type of log source
        server_id:
          type: string
          description: Identifier of the server that generated the log
        player_id:
          type: string
          description: Player/user identifier if applicable
        session_id:
          type: string
          description: Session identifier if applicable
        metadata:
          type: object
          additionalProperties: true
          description: Additional key-value metadata

    IngestRequest:
      type: object
      required:
        - logs
      properties:
        logs:
          type: array
          items:
            type: string
          description: Array of raw log lines to ingest
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata to apply to all logs

    IngestResponse:
      type: object
      properties:
        totalReceived:
          type: integer
          description: Number of log lines received
        totalIngested:
          type: integer
          description: Number of logs successfully ingested
        errors:
          type: array
          items:
            type: string
          description: List of any parsing errors

    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Query string in Cabinet Query Language
        parameters:
          type: object
          additionalProperties: true
          description: Query parameters
        limit:
          type: integer
          default: 100
          description: Maximum number of results

    QueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LogEvent'
        count:
          type: integer
          description: Total number of results
        executionTime:
          type: number
          description: Query execution time in milliseconds

    DetectionRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/LogEvent'
        config:
          type: object
          additionalProperties: true
          description: Detection configuration parameters

    DetectionResult:
      type: object
      properties:
        ruleId:
          type: string
          description: ID of the detection rule that triggered
        ruleName:
          type: string
          description: Name of the detection rule
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score (0-1)
        description:
          type: string
          description: Description of what was detected
        metadata:
          type: object
          additionalProperties: true
          description: Additional detection metadata

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              message:
                type: string
        version:
          type: string
          description: API version
        uptime:
          type: integer
          description: Uptime in seconds

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - System
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/logs/ingest:
    post:
      summary: Ingest log events
      description: Batch ingest raw log lines for parsing and storage
      tags:
        - Logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Logs ingested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /api/v1/logs:
    get:
      summary: Query log events
      description: Retrieve log events with optional filtering
      tags:
        - Logs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Number of results per page
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
          description: Start time for filtering
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
          description: End time for filtering
        - name: search
          in: query
          schema:
            type: string
          description: Search text
        - name: source
          in: query
          schema:
            type: string
          description: Filter by source
        - name: severity
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
          description: Filter by severity
        - name: sortBy
          in: query
          schema:
            type: string
            default: timestamp
          description: Sort field
        - name: descending
          in: query
          schema:
            type: boolean
            default: true
          description: Sort order
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEvent'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalCount:
                    type: integer
                  totalPages:
                    type: integer

  /api/v1/logs/stream:
    get:
      summary: Stream log events
      description: Real-time log event stream using Server-Sent Events
      tags:
        - Logs
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Stream logs since this time
        - name: source
          in: query
          schema:
            type: string
          description: Filter by source
        - name: severity
          in: query
          schema:
            type: string
          description: Filter by severity
      responses:
        '200':
          description: Event stream started
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/logs/{id}:
    get:
      summary: Get a specific log event
      tags:
        - Logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Log event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEvent'
        '404':
          description: Log event not found

    delete:
      summary: Delete a specific log event
      tags:
        - Logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Log event deleted
        '404':
          description: Log event not found

  /api/v1/logs/stats:
    get:
      summary: Get log statistics
      tags:
        - Logs
      parameters:
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEvents:
                    type: integer
                  eventsBySource:
                    type: object
                    additionalProperties:
                      type: integer
                  eventsBySeverity:
                    type: object
                    additionalProperties:
                      type: integer
                  eventsPerHour:
                    type: array
                    items:
                      type: object
                      properties:
                        hour:
                          type: string
                          format: date-time
                        count:
                          type: integer

  /api/v1/query/execute:
    post:
      summary: Execute a query
      description: Execute a query using Cabinet Query Language
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid query

  /api/v1/query/validate:
    post:
      summary: Validate a query
      description: Validate query syntax without executing
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
      responses:
        '200':
          description: Query validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string

  /api/v1/detection/scumscan:
    post:
      summary: Run Scumscan detection
      description: Analyze logs for suspicious player behavior patterns
      tags:
        - Detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionRequest'
      responses:
        '200':
          description: Detection completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetectionResult'
                  summary:
                    type: object
                    properties:
                      totalAnalyzed:
                        type: integer
                      threatsDetected:
                        type: integer
                      highSeverityCount:
                        type: integer

  /api/v1/detection/hackwatch:
    post:
      summary: Run Hackwatch detection
      description: Detect potential hacking attempts and exploits
      tags:
        - Detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionRequest'
      responses:
        '200':
          description: Detection completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetectionResult'

  /api/v1/detection/adminabuse:
    post:
      summary: Run Admin Abuse detection
      description: Detect potential admin power abuse
      tags:
        - Detection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionRequest'
      responses:
        '200':
          description: Detection completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetectionResult'

tags:
  - name: System
    description: System health and status endpoints
  - name: Logs
    description: Log ingestion and retrieval operations
  - name: Query
    description: Query engine operations
  - name: Detection
    description: Detection and analysis operations