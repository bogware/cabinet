apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cabinet-data-pvc
  namespace: cabinet
  labels:
    app: cabinet
    component: storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # Uncomment and set to your storage class:
  # storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cabinet-logs-pvc
  namespace: cabinet
  labels:
    app: cabinet
    component: logging
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Uncomment and set to your storage class:
  # storageClassName: standard
