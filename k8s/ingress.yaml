# Replace the host, and add TLS through your own issuer. Prometheus scrapes the pods directly, and
# /metrics has no authentication, so here it goes to a Service that doesn't exist, which answers 503.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cabinet-api
  labels:
    app: cabinet
    component: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # Long enough for streams and exports
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3700"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: cabinet.example.com
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: cabinet-api-blocked
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cabinet-api
                port:
                  number: 80
