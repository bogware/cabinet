# Cabinet Secrets Template
# Copy this file, fill in the base64-encoded values, and apply to your cluster:
#   cp secret-template.yaml secrets.yaml
#   # Edit secrets.yaml with your actual values
#   kubectl apply -f secrets.yaml
#
# To base64-encode a value:
#   echo -n 'your-value' | base64
#
# IMPORTANT: Never commit the filled-in secrets.yaml to version control.
apiVersion: v1
kind: Secret
metadata:
  name: cabinet-secrets
  namespace: cabinet
  labels:
    app: cabinet
type: Opaque
data:
  # PostgreSQL connection string
  # Example: Host=postgres.cabinet.svc;Port=5432;Database=cabinet;Username=cabinet;Password=changeme
  storage-connection-string: ""

  # Redis connection string (for distributed mode)
  # Example: redis.cabinet.svc:6379,password=changeme
  redis-connection-string: ""

  # API key for the first configured key (Enterprise tier)
  # Generate a strong random key: openssl rand -hex 32
  api-key-0: ""
