# Not applied by kustomization.yaml, so that no placeholder password can reach a cluster. Create
# the real secret first, or replace the values here and apply this file by hand:
#
#   kubectl create namespace cabinet
#   kubectl -n cabinet create secret generic cabinet-secrets \
#     --from-literal=postgres-password="$(openssl rand -hex 24)" \
#     --from-literal=api-key-0="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: cabinet-secrets
  namespace: cabinet
type: Opaque
stringData:
  postgres-password: REPLACE_ME
  api-key-0: REPLACE_ME
