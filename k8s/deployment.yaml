apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabinet-api
  namespace: cabinet
  labels:
    app: cabinet
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cabinet
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cabinet
        component: api
    spec:
      serviceAccountName: cabinet-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: cabinet-api
          image: ghcr.io/draxios/cabinet:latest  # Override with specific tag in CD pipeline (e.g., kustomize set image)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Storage__Type
              valueFrom:
                configMapKeyRef:
                  name: cabinet-config
                  key: storage-type
            - name: Storage__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: cabinet-secrets
                  key: storage-connection-string
            - name: Distributed__Enabled
              value: "true"
            - name: Distributed__RedisConnectionString
              valueFrom:
                secretKeyRef:
                  name: cabinet-secrets
                  key: redis-connection-string
            - name: Distributed__InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ApiKeys__Keys__0__Key
              valueFrom:
                secretKeyRef:
                  name: cabinet-secrets
                  key: api-key-0
            - name: ApiKeys__Keys__0__Tier
              value: "Enterprise"
            - name: ApiKeys__Keys__0__Name
              value: "Production Key"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cabinet-api
  namespace: cabinet
  labels:
    app: cabinet
