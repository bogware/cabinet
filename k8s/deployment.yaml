apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabinet-api
  labels:
    app: cabinet
    component: api
spec:
  # Instances share PostgreSQL, and one at a time runs background work
  replicas: 2
  selector:
    matchLabels:
      app: cabinet
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cabinet
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cabinet-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cabinet-api
          # A released version, so a restart never changes what runs; kustomize images can override it
          image: ghcr.io/bogware/cabinet:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Storage__Type
              valueFrom:
                configMapKeyRef:
                  name: cabinet-config
                  key: storage-type
            - name: Storage__RetentionDays
              valueFrom:
                configMapKeyRef:
                  name: cabinet-config
                  key: retention-days
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cabinet-secrets
                  key: postgres-password
            - name: Storage__ConnectionString
              value: Host=postgres;Database=cabinet;Username=cabinet;Password=$(POSTGRES_PASSWORD)
            - name: ApiKeys__Keys__0__Key
              valueFrom:
                secretKeyRef:
                  name: cabinet-secrets
                  key: api-key-0
            - name: ApiKeys__Keys__0__Tier
              value: Admin
            - name: ApiKeys__Keys__0__Name
              value: Cluster Admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: data
              mountPath: /app/data
      volumes:
        - name: logs
          emptyDir: {}
        - name: data
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cabinet
              component: api
